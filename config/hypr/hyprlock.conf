# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprlock - Cyberpunk Lock Screen                           ║
# ╚══════════════════════════════════════════════════════════════╝

background {
    monitor =
    path = ~/.config/hypr/wallpapers/default.png
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ff00ffee)
    inner_color = rgba(0d0d1aee)
    font_color = rgba(00ffffee)
    fade_on_empty = true
    placeholder_text = <span foreground="##00ffff">⚡ Password...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ff00ffee)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date '+%A, %d %B')"
    color = rgba(00ffffcc)
    font_size = 18
    font_family = Ubuntu Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
