# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprland Config - Cyberpunk Neon Theme                     ║
# ║  Optimizado para laptop HP 4GB RAM                          ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── MONITORES ────────────────────────────────────────────────
monitor=,preferred,auto,1

# ─── VARIABLES ────────────────────────────────────────────────
$terminal = wezterm
$menu = wofi --show drun
$browser = firefox
$fileManager = thunar
$mod = SUPER

# ─── AUTOSTART ────────────────────────────────────────────────
exec-once = waybar
exec-once = dunst
exec-once = swww-daemon
exec-once = swww img ~/.config/hypr/wallpapers/default.png --transition-type wipe
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ─── ENTORNO ──────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ─── INPUT ────────────────────────────────────────────────────
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ─── OPTIMIZACIONES PARA 4GB RAM ─────────────────────────────
# Desactivar animaciones pesadas, mantener las ligeras
# Reducir blur y efectos que consumen VRAM

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(ff00ffee) rgba(00ffffee) 45deg
    col.inactive_border = rgba(1a1a2eaa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
        xray = false
        noise = 0.02
    }

    # Sombras ligeras
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(ff00ff33)
    }
}

# Animaciones optimizadas (rápidas y ligeras)
animations {
    enabled = true
    bezier = cyberpunk, 0.05, 0.9, 0.1, 1.0
    bezier = neon, 0.4, 0.0, 0.2, 1.0

    animation = windows, 1, 3, cyberpunk
    animation = windowsOut, 1, 3, cyberpunk, popin 80%
    animation = border, 1, 5, neon
    animation = borderangle, 1, 30, neon, loop
    animation = fade, 1, 3, cyberpunk
    animation = workspaces, 1, 3, neon, slide
}

# Layout optimizado
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = true
    swallow_regex = ^(wezterm)$
}

# ─── REGLAS DE VENTANAS ───────────────────────────────────────
windowrulev2 = opacity 0.92 0.88, class:^(wezterm)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(waypaper)$
windowrulev2 = size 800 600, title:^(waypaper)$

# ─── KEYBINDINGS ──────────────────────────────────────────────

# Aplicaciones
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, W, exec, waypaper
bind = $mod, L, exec, hyprlock

# Ventanas
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Foco
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Mover ventanas
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Redimensionar
bind = $mod CTRL, left, resizeactive, -30 0
bind = $mod CTRL, right, resizeactive, 30 0
bind = $mod CTRL, up, resizeactive, 0 -30
bind = $mod CTRL, down, resizeactive, 0 30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Mover ventana a workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll entre workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Media / Función
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Logout menu
bind = $mod SHIFT, E, exec, wlogout
